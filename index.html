<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GeoSMART</title>
    <style>
        :root {
            --biru-gelap: #0b2a5b;
            --biru: #1d4ed8;
            --biru-terang: #3b82f6;
            --biru-muda: #eff6ff;
            --garis: #bfdbfe;
            --teks: #1e293b;
            --teks-redup: #475569;
            --placeholder: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
        }

        html, body {
            min-height: 100%;
        }

        body {
            background-image: url('assets/images/bgkubika3.png');
            background-color: var(--biru-muda);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            position: relative;
        }

        /* Overlay biru lembut agar card tetap terbaca */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: linear-gradient(160deg, rgba(219, 234, 254, 0.88), rgba(147, 197, 253, 0.72));
            z-index: 1;
        }

        .login-card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.96);
            width: 100%;
            max-width: 400px;
            padding: clamp(24px, 6vw, 40px) clamp(20px, 6vw, 36px);
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 45px rgba(11, 42, 91, 0.22);
            border: 2px solid var(--biru-terang);
        }

        .logo-container img {
            display: block;
            width: clamp(120px, 40vw, 170px);
            height: auto;
            margin: 0 auto 14px;
            filter: drop-shadow(0 6px 12px rgba(11, 42, 91, 0.15));
        }

        h1 {
            color: var(--biru-gelap);
            font-size: clamp(26px, 7vw, 32px);
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .subtitle {
            color: var(--teks-redup);
            font-size: clamp(13px, 3.6vw, 15px);
            line-height: 1.5;
            margin-bottom: 28px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 14px 16px;
            background-color: #f8fafc;
            border: 2px solid var(--garis);
            border-radius: 14px;
            color: var(--teks);
            outline: none;
            font-size: 16px; /* 16px mencegah zoom otomatis di iPhone */
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        select {
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' fill='none' stroke='%231d4ed8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>");
            background-repeat: no-repeat;
            background-position: right 16px center;
            padding-right: 44px;
            cursor: pointer;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--biru);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.25);
        }

        input::placeholder { color: var(--placeholder); }
        select:invalid { color: var(--placeholder); }

        select option {
            background-color: white;
            color: var(--teks);
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 4px;
            background: linear-gradient(90deg, var(--biru-terang), var(--biru));
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 20px rgba(29, 78, 216, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(29, 78, 216, 0.4);
        }

        button:active { transform: translateY(0); }

        button:focus-visible {
            outline: 3px solid var(--biru-gelap);
            outline-offset: 3px;
        }

        /* Layar laptop / PC */
        @media (min-width: 1024px) {
            .login-card { max-width: 440px; }
        }

        /* HP layar kecil */
        @media (max-width: 380px) {
            body { padding: 16px 12px; }
            .login-card { border-radius: 20px; }
        }

        /* HP posisi landscape */
        @media (max-height: 560px) {
            body { align-items: flex-start; }
            .logo-container img { width: 90px; margin-bottom: 8px; }
            .subtitle { margin-bottom: 16px; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-container">
            <img src="assets/images/geosmart.png" alt="Logo GeoSMART">
        </div>

        <h1>GeoSMART</h1>
        <p class="subtitle">Belajar Geometri Jadi Lebih Interaktif</p>

        <form id="loginForm">
            <input type="text" id="username" placeholder="Nama Pengguna" autocomplete="name" required>

            <select id="deviceType" required>
                <option value="" disabled selected>Pilih Perangkat</option>
                <option value="hp">Handphone (HP)</option>
                <option value="laptop">Laptop / PC</option>
            </select>

            <button type="submit">Masuk Sekarang</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('username').value.trim();
            const device = document.getElementById('deviceType').value;
            localStorage.setItem('userName', name);

            if (device === 'hp') {
                window.location.href = 'dashboardhp.html';
            } else {
                window.location.href = 'dashboard.html';
            }
        });
    </script>

</body>
</html>
